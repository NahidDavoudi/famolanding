# /opt/apps/<name>/docker-compose.yml  (برای همه پروژه‌ها یکسان؛ فقط .env فرق می‌کنه)
services:
  app:
    build: .
    container_name: famo-public      # همین اسم توی Caddyfile استفاده می‌شه
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Tehran
    volumes:
      - ./uploads:/opt/uploads/${UPLOADS_DIR:-uploads}
    mem_limit: ${MEM_LIMIT:-512m}
    networks: [proxy, db_net]

networks:
  proxy:
    external: true
  db_net:
    external: true
